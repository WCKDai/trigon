name: CI

# Pushes to main are checked on the org's trusted Linux runner (alpha), whose runner group allows
# this workflow only at refs/heads/main: code reaches alpha once it is on main. Every other push is
# checked on a GitHub-hosted runner (free for this public repository), with no secrets.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# One trusted runner is shared with PolyCore and Polykrom: a running check finishes, and only
# the newest waiting push of a branch is kept.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # main on alpha. The R2 compile-cache key is in the runner user's ~/.aws/credentials on alpha
  # (WCKDai/platform alpha-r2-credentials.yml), never in this repository's secrets; without it
  # the job compiles uncached.
  gates-main:
    name: fmt, Clippy, tests, release build (alpha)
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, rust-16, trusted]
    timeout-minutes: 60
    env:
      R2_READY: ${{ vars.R2_CONFIGURED == 'true' }}
      SCCACHE_BUCKET: ${{ vars.R2_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "true"
      SCCACHE_S3_KEY_PREFIX: trigon
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install sccache
        if: env.R2_READY == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Use the R2 compile cache
        if: env.R2_READY == 'true'
        run: |
          if [ ! -f "$HOME/.aws/credentials" ]; then echo "::notice::no R2 key on this runner; compiling uncached"; exit 0; fi
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: trigon-trusted-linux
          cache-on-failure: true
          cache-targets: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked --bin trigon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trigon-linux-x64
          path: target/release/trigon
          retention-days: 7
          if-no-files-found: error

  # Every other branch on a GitHub-hosted runner: no secrets, and a build cache restored from
  # main's (GitHub's cache is scoped per branch, so a branch can't write main's entries).
  gates:
    name: fmt, Clippy, tests
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Software Vulkan for tests that draw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: trigon-hosted-linux
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
